<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Generator</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <!-- JSONEditor -->
    <link
            href="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.css"
            rel="stylesheet"
    >

    <!-- Application CSS -->
    <link
            rel="stylesheet"
            href="/css/app.css"
    >
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="h3 mb-1">
                        Report Generator
                    </h1>

                    <p class="text-muted mb-4">
                        Generate reports in PDF, XLSX or CSV format.
                    </p>


                    <!-- Report -->
                    <div class="mb-3">

                        <label
                                for="reportName"
                                class="form-label"
                        >
                            Report
                        </label>

                        <select
                                id="reportName"
                                class="form-select"
                        >
                            <option value="findallstudents">
                                Find All Students
                            </option>
                        </select>

                    </div>


                    <!-- Format -->
                    <div class="mb-4">

                        <label
                                for="format"
                                class="form-label"
                        >
                            Format
                        </label>

                        <select
                                id="format"
                                class="form-select"
                        >
                            <option value="PDF">PDF</option>
                            <option value="XLSX">XLSX</option>
                            <option value="CSV">CSV</option>
                        </select>

                    </div>


                    <!-- JSON Parameters -->
                    <div class="mb-4">

                        <label
                                class="form-label"
                        >
                            Parameters (JSON)
                        </label>

                        <div id="parametersEditor"></div>

                    </div>


                    <!-- Generate -->
                    <div class="d-flex justify-content-end">

                        <button
                                id="generateButton"
                                type="button"
                                class="btn btn-primary"
                        >
                            Generate report
                        </button>

                    </div>


                    <!-- Success -->
                    <div
                            id="successMessage"
                            class="alert alert-success mt-4 d-none"
                    ></div>


                    <!-- Error -->
                    <div
                            id="errorMessage"
                            class="alert alert-danger mt-4 d-none"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- JSONEditor -->
<script
        src="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.js">
</script>

<!-- Application JS -->
<script src="/js/app.js"></script>

</body>
</html>
