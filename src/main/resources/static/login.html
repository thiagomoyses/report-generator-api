<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link
            rel="stylesheet"
            href="/css/app.css"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="h3 mb-4">
                        Login
                    </h1>

                    <div class="mb-3">

                        <label
                                for="username"
                                class="form-label"
                        >
                            Username
                        </label>

                        <input
                                id="username"
                                type="text"
                                class="form-control"
                        >

                    </div>

                    <div class="mb-4">

                        <label
                                for="password"
                                class="form-label"
                        >
                            Password
                        </label>

                        <input
                                id="password"
                                type="password"
                                class="form-control"
                        >

                    </div>

                    <button
                            id="loginButton"
                            class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                    <div
                            id="message"
                            class="alert mt-3 d-none"
                    ></div>

                    <div class="text-center mt-3">

                        <a href="/register.html">
                            Create an account
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
